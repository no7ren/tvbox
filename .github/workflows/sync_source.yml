name: Daily Sync TVBox JSON

on:
  schedule:
    # 每天北京时间早上 8:00 执行 (UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮随时触发更新

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout file from public repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so git knows how to merge correctly if needed
          fetch-depth: 0 

      - name: Download tvbox_full.json
        run: |
          # 使用 curl 直接下载该文件的原始 Raw 数据并覆盖保存到你本地仓库的根目录
          curl -L -o "tvbox_full.json" "https://raw.githubusercontent.com/25175/tvyuan/refs/heads/master/tvbox_full.json"

      - name: 3. Native Force Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # ⚓ Force the runner out of "detached HEAD" and onto your live branch
          # (Change 'main' to 'master' below if your branch is named master)
          git checkout main
          
          git add tvbox_full.json
          
          if git diff-index --quiet HEAD --; then
            echo "No changes detected. The file matches upstream."
          else
            git commit -m "Auto-sync latest tvbox_full.json"
            
            # Fetch the absolute latest remote state to resolve historical lag
            git fetch origin main
            git rebase origin/main
            
            git push origin main
          fi

