name: Daily Sync TVBox JSON

on:
  schedule:
    # 每天北京时间早上 8:00 执行 (UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮随时触发更新

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout file from public repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so git knows how to merge correctly if needed
          fetch-depth: 0 

      - name: Download tvbox_full.json
        run: |
          # 使用 curl 直接下载该文件的原始 Raw 数据并覆盖保存到你本地仓库的根目录
          curl -L -o "tvbox_full.json" "https://raw.githubusercontent.com/25175/tvyuan/refs/heads/master/tvbox_full.json"

      - name: 3. Native Force Push Changes
        run: |
          # Configure a temporary Git identity for the GitHub runner bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the freshly downloaded file
          git add tvbox_full.json
          
          # Check if there are actual new differences to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes detected. The file is already identical to the upstream copy."
          else
            git commit -m "Auto-sync latest tvbox_full.json"
            # 🔥 Force-push to overwrite any synchronization conflicts directly
            git push origin main --force
          fi

